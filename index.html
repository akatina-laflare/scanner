<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#070b14;
  --glass:rgba(255,255,255,.075);
  --stroke:rgba(255,255,255,.16);
  --text:#f3f5fb;
  --muted:rgba(243,245,251,.58);
  --accent:#8ea6ff;
  --accent2:#5ee8cf;
  --danger:#ff6b81;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{opacity:.35;pointer-events:none}
.hidden{display:none!important}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

/* background */
.bg{position:fixed;inset:0;overflow:hidden;z-index:0;background:
  radial-gradient(1100px 760px at 8% -12%,#1b2558 0%,transparent 60%),
  radial-gradient(900px 700px at 112% 112%,#0d3a44 0%,transparent 55%),var(--bg)}
.bg i{position:absolute;border-radius:50%;filter:blur(64px);opacity:.5;animation:float 18s ease-in-out infinite alternate}
.b1{width:340px;height:340px;background:#5b6cff;top:-90px;left:-70px}
.b2{width:300px;height:300px;background:#19d3b0;bottom:8%;right:-100px;animation-delay:-6s!important}
.b3{width:250px;height:250px;background:#b25bff;top:42%;left:28%;opacity:.3!important;animation-delay:-12s!important}
@keyframes float{to{transform:translate(40px,60px) scale(1.15)}}
@media (prefers-reduced-motion:reduce){.bg i{animation:none}}

.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);border:1px solid var(--stroke);border-radius:22px;box-shadow:0 12px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.14)}

.screen{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column}

/* home */
.top{margin:calc(env(safe-area-inset-top) + 12px) 14px 0;padding:10px 10px 10px 18px;display:flex;align-items:center;gap:8px;position:relative;z-index:2}
.title-wrap{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.doc-name{background:none;border:0;color:var(--text);font:inherit;font-size:19px;font-weight:650;letter-spacing:-.01em;outline:none;width:100%;text-overflow:ellipsis;-webkit-user-select:text;user-select:text}
.muted{color:var(--muted);font-size:13px}
.icon-btn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);transition:transform .15s,background .2s}
.icon-btn:active{transform:scale(.92)}
.icon-btn.on{background:var(--accent);color:#0b1020;border-color:transparent}
.icon-btn.auto{color:var(--accent2);border-color:rgba(94,232,207,.35);background:rgba(94,232,207,.1)}
.icon-btn.working svg{animation:twinkle 1s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.35;transform:scale(.85) rotate(-10deg)}to{opacity:1;transform:scale(1.1) rotate(10deg)}}

.grid{flex:1;overflow-y:auto;padding:16px 14px calc(140px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px;align-content:start;-webkit-overflow-scrolling:touch}
.card{position:relative;padding:8px;border-radius:20px;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;animation:pop .35s cubic-bezier(.2,.9,.3,1.2) both;cursor:pointer}
.card:active{transform:scale(.97)}
.card img{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 6px 22px rgba(0,0,0,.45);display:block}
.num{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:650;padding:3px 10px;border-radius:99px;background:rgba(10,14,25,.6);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.15)}
.card-actions{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between}
.card-actions button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(15,20,35,.7);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2)}
.card-actions button svg.i{width:18px;height:18px}
.card-actions .del{background:rgba(255,80,105,.85);border-color:transparent}
.editing .card{animation:jiggle .28s ease-in-out infinite alternate}
.editing .card:nth-child(2n){animation-delay:-.14s}
@keyframes jiggle{from{transform:rotate(-.6deg)}to{transform:rotate(.6deg)}}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(10px)}}

.empty{position:absolute;inset:0;display:grid;place-items:center;padding:24px;pointer-events:none}
.empty-card{max-width:320px;padding:34px 26px;text-align:center}
.empty-ic{width:68px;height:68px;margin:0 auto 18px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(142,166,255,.38),rgba(94,232,207,.26));border:1px solid rgba(255,255,255,.2)}
.empty-ic svg.i{width:32px;height:32px}
.empty-card h2{font-size:20px;font-weight:650;margin-bottom:8px}
.empty-card p{color:var(--muted);font-size:14px;line-height:1.5}

.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 16px);display:flex;align-items:center;gap:26px;padding:10px 26px;border-radius:34px;z-index:2}
.dock-btn{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:550;color:var(--muted);width:58px;transition:transform .15s}
.dock-btn:active{transform:scale(.9)}
.dock-btn svg.i{color:var(--text)}
.shutter{width:72px;height:72px;border-radius:50%;padding:5px;background:linear-gradient(135deg,#9fb4ff,#5ee8cf);box-shadow:0 8px 30px rgba(94,140,255,.45)}
.shutter span{display:block;width:100%;height:100%;border-radius:50%;background:#fff;border:3px solid rgba(10,14,25,.85);transition:transform .15s}
.shutter:active span{transform:scale(.88)}

/* editor */
.editor{z-index:5;background:rgba(5,7,14,.9);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);animation:fade .2s}
.ed-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 12px 8px}
.pill{height:38px;padding:0 15px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font-weight:600;font-size:15px;transition:transform .15s}
.pill:active{transform:scale(.94)}
.pill.accent{background:linear-gradient(135deg,#8ea6ff,#5ee8cf);color:#081020;border-color:transparent}
.seg{display:flex;padding:4px;border-radius:99px;gap:2px}
.seg button{flex:1;padding:7px 14px;border-radius:99px;font-size:14px;font-weight:600;color:var(--muted);transition:background .2s,color .2s;white-space:nowrap}
.seg button.on{background:rgba(255,255,255,.18);color:var(--text)}
.stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;touch-action:none;overflow:hidden;min-height:0}
.crop-box{position:relative}
.crop-box canvas{display:block;border-radius:3px}
#cropSvg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.preview{max-width:calc(100% - 32px);max-height:calc(100% - 32px);border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.6);background:#fff}
.loupe{position:absolute;top:14px;left:14px;width:120px;height:120px;border-radius:50%;overflow:hidden;border:2px solid rgba(255,255,255,.85);box-shadow:0 10px 30px rgba(0,0,0,.55);pointer-events:none}
.loupe.right{left:auto;right:14px}
.loupe canvas{width:100%;height:100%;display:block}
.ed-tools{padding:8px 14px calc(env(safe-area-inset-bottom) + 16px);display:flex;flex-direction:column;gap:12px}
.tool-row{display:flex;justify-content:center;gap:12px}
.tool{display:flex;align-items:center;gap:8px;padding:11px 18px;border-radius:16px;font-size:14px;font-weight:600;transition:transform .15s}
.tool:active{transform:scale(.94)}
.hint{text-align:center;color:var(--muted);font-size:12.5px}
.chips{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips>:first-child{margin-left:auto}.chips>:last-child{margin-right:auto}
.chip{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.chip .th{width:60px;height:78px;border-radius:12px;overflow:hidden;border:2px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);transition:border-color .2s,box-shadow .2s}
.chip .th canvas{width:100%;height:100%;object-fit:cover;display:block}
.chip.on{color:var(--text)}
.chip.on .th{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(94,232,207,.22)}

/* sheet & modal */
.overlay{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.4);animation:fade .2s}
.sheet-wrap{display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;margin:0 10px calc(env(safe-area-inset-bottom) + 10px);padding:10px 16px 16px;border-radius:28px;background:rgba(28,34,54,.62);animation:up .32s cubic-bezier(.2,.9,.3,1)}
.grab{width:40px;height:5px;border-radius:9px;background:rgba(255,255,255,.3);margin:4px auto 14px}
.sheet h3{font-size:17px;font-weight:650;margin:0 4px 12px}
.sheet .seg{margin-bottom:6px}
.row-btn{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);margin-top:8px;font-size:15px;font-weight:560;text-align:left;transition:transform .15s,background .2s}
.row-btn:active{transform:scale(.98);background:rgba(255,255,255,.12)}
.row-btn .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:rgba(142,166,255,.2)}
.row-btn small{display:block;color:var(--muted);font-size:12px;font-weight:450;margin-top:1px}
.modal-wrap{display:grid;place-items:center;padding:24px}
.modal{width:100%;max-width:330px;padding:22px;text-align:center;background:rgba(28,34,54,.66);animation:up .25s cubic-bezier(.2,.9,.3,1)}
.modal p{font-size:16px;line-height:1.45;margin-bottom:18px}
.modal-btns{display:flex;gap:10px}
.modal-btns button{flex:1;height:44px;border-radius:14px;font-weight:600;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
.modal-btns .danger{background:var(--danger);border-color:transparent;color:#fff}

.busy{position:fixed;inset:0;z-index:20;display:grid;place-content:center;justify-items:center;gap:14px;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);font-size:14px;font-weight:550}
.spinner{width:40px;height:40px;border-radius:50%;border:3px solid rgba(255,255,255,.18);border-top-color:var(--accent2);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 112px);transform:translate(-50%,20px);z-index:30;padding:11px 18px;border-radius:99px;font-size:14px;font-weight:550;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;background:rgba(28,34,54,.75);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--stroke);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (min-width:720px){.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));padding-left:28px;padding-right:28px}.top{margin-left:28px;margin-right:28px}}

<script>
'use strict';
const $ = s => document.querySelector(s);
const raf = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
const FILTERS = [['magic','Magico'],['original','Originale'],['enhance','Grigio+'],['gray','Grigi'],['bw','B/N']];
const FULL = [[0,0],[1,0],[1,1],[0,1]];
const ICON = {
  left:'<svg class="i" viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></svg>',
  right:'<svg class="i" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></svg>',
  del:'<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  pen:'<svg class="i" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>',
  check:'<svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
};

let pages = [], editMode = false, exportSize = 'a4', lastFilter = 'magic', docName = '';
let autoName = true, autoFrom = null, naming = false, pendingName = false;

/* ---------------- nome automatico (OCR in locale) ---------------- */
const TESS_SRC = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
let ocrWorker = null, ocrLoading = null;
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Script non caricato')); document.head.appendChild(s); });
}
function getOCR() {
  if (ocrWorker) return Promise.resolve(ocrWorker);
  if (!ocrLoading) ocrLoading = (async () => {
    if (!window.Tesseract) await loadScript(TESS_SRC);
    ocrWorker = await Tesseract.createWorker('ita');
    return ocrWorker;
  })().catch(e => { ocrLoading = null; throw e; });
  return ocrLoading;
}
async function ocrText(blob) {
  const c = await blobToCanvas(blob, 1800);
  const w = await getOCR();
  const { data } = await w.recognize(c);
  return data.text || '';
}
// [nome, aggiungi data?, regole forti (3 punti), regole deboli (1 punto)]
const DOC_TYPES = [
  ["Carta d'identità", false, [/CARTA D.?IDENTITA/, /IDENTITY CARD/, /CARTE D.?IDENTITE/], [/REPUBBLICA ITALIANA/, /COMUNE DI/, /LUOGO E DATA DI NASCITA|LUOGO DI NASCITA/, /STATURA/, /CITTADINANZA/, /SCADENZA/]],
  ['Patente', false, [/PATENTE DI GUIDA/, /DRIVING LICEN/], [/MINISTERO DELLE INFRASTRUTTURE|MIT.?UCO/, /\b4[ABC]\b/, /\bCATEGORI/]],
  ['Passaporto', false, [/PASSAPORTO/, /PASSPORT/], [/P<ITA/, /AUTORITA/]],
  ['Tessera sanitaria', false, [/TESSERA SANITARIA/, /TESSERA EUROPEA/, /HEALTH INSURANCE CARD/], [/CODICE FISCALE/, /SERVIZIO SANITARIO/]],
  ['Permesso di soggiorno', false, [/PERMESSO DI SOGGIORNO/, /RESIDENCE PERMIT/], []],
  ['Ricetta', true, [/RICETTA ELETTRONICA/, /PROMEMORIA PER L.?ASSISTITO/, /RICETTA MEDICA/], [/PRESCRIZIONE/, /ESENZIONE/, /\bNRE\b/, /SERVIZIO SANITARIO NAZIONALE/]],
  ['Certificato medico', true, [/CERTIFICATO MEDICO/, /CERTIFICATO DI MALATTIA/, /CERTIFICATO DI IDONEITA/], [/PROGNOSI/, /DIAGNOSI/]],
  ['Referto', true, [/REFERTO/], [/ESAME|ESAMI/, /LABORATORIO/, /EMOCROMO/, /ECOGRAFI/, /RADIOLOG/, /DIAGNOSI/, /VALORI DI RIFERIMENTO/]],
  ['Busta paga', true, [/CEDOLINO/, /BUSTA PAGA/, /NETTO IN BUSTA/], [/RETRIBUZIONE/, /COMPETENZE/, /TRATTENUTE/, /INPS/]],
  ['Bolletta', true, [/BOLLETTA/], [/\bKWH\b/, /\bSMC\b/, /CONSUMI/, /FORNITURA/, /POD\b|PDR\b/, /ENEL|A2A|HERA|EDISON|PLENITUDE|IREN|SORGENIA|ACEA|FASTWEB|\bTIM\b|VODAFONE|WINDTRE|ILIAD/]],
  ['Multa', true, [/VERBALE DI ACCERTAMENTO/, /VERBALE DI CONTESTAZIONE/], [/CODICE DELLA STRADA/, /VIOLAZIONE/, /POLIZIA/]],
  ['Fattura', true, [/FATTURA/], [/IMPONIBILE/, /PARTITA IVA|P\.? ?IVA/, /ALIQUOTA/]],
  ['Scontrino', true, [/DOCUMENTO COMMERCIALE/, /SCONTRINO/], [/TOTALE COMPLESSIVO/, /CONTANTI/, /\bRESTO\b/, /PAGAMENTO ELETTRONICO/]],
  ['Ricevuta', true, [/RICEVUTA/], [/PAGAMENTO/, /IMPORTO/]],
  ['Contratto', true, [/CONTRATTO/], [/TRA LE PARTI/, /SI CONVIENE/, /SOTTOSCRITT/, /CLAUSOL/]],
  ['Certificato', true, [/CERTIFICATO/, /ATTESTATO/], [/SI CERTIFICA|SI ATTESTA/]],
  ['Diploma', false, [/DIPLOMA DI/, /DIPLOMA$/m], [/CONFERISCE|CONSEGUITO/]],
  ['Lettera', true, [], [/GENTILE|EGREGI/, /CORDIALI SALUTI|DISTINTI SALUTI/, /OGGETTO:/]]
];
const PROVIDERS = ['Enel', 'A2A', 'Hera', 'Edison', 'Plenitude', 'Iren', 'Sorgenia', 'Acea', 'Fastweb', 'TIM', 'Vodafone', 'WindTre', 'Iliad'];
function normText(t) {
  return t.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’‘`´]/g, "'").toUpperCase().replace(/[ \t]+/g, ' ');
}
function todayStr() { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${p(d.getDate())}-${p(d.getMonth() + 1)}-${d.getFullYear()}`; }
function nameFromText(raw) {
  const T = normText(raw);
  let best = null, bestScore = 0;
  for (const [name, withDate, strong, weak] of DOC_TYPES) {
    let s = 0;
    strong.forEach(r => { if (r.test(T)) s += 3; });
    weak.forEach(r => { if (r.test(T)) s += 1; });
    if (s > bestScore) { bestScore = s; best = [name, withDate]; }
  }
  if (best && bestScore >= 3) {
    let [name, withDate] = best;
    if (name === 'Bolletta') { const pv = PROVIDERS.find(p => new RegExp('\\b' + p.toUpperCase() + '\\b').test(T)); if (pv) name += ' ' + pv; }
    return withDate ? `${name} ${todayStr()}` : name;
  }
  // nessun tipo riconosciuto: usa la prima riga che sembra un titolo
  const lines = raw.split(/\n+/).map(l => l.trim()).filter(Boolean).slice(0, 10);
  for (const l of lines) {
    const letters = (l.match(/[A-Za-zÀ-ÿ]/g) || []).length;
    if (l.length >= 6 && l.length <= 42 && letters / l.length > 0.75 && /\s/.test(l)) {
      const t = l.toLowerCase().replace(/\s+/g, ' ').replace(/[^\p{L}\p{N} '’.-]/gu, '').trim();
      if (t.length >= 6) return t.charAt(0).toUpperCase() + t.slice(1);
    }
  }
  return null;
}
function saveNameMeta() { safe(store.set('name', docName)); safe(store.set('autoName', autoName)); safe(store.set('autoFrom', autoFrom)); }
async function autoNameMaybe(force = false) {
  if (force) { autoName = true; autoFrom = null; }
  if (!autoName) return;
  const first = sorted()[0];
  if (!first || first.id === autoFrom) return;
  if (naming) { pendingName = true; return; }
  naming = true; updateHeader();
  try {
    const name = nameFromText(await ocrText(first.processed));
    if (autoName) {
      autoFrom = first.id;
      if (name) { docName = name; $('#docName').value = docName; toast('Riconosciuto: ' + name); }
      else if (force) toast('Tipo di documento non riconosciuto');
      saveNameMeta();
    }
  } catch (e) {
    console.warn(e);
    if (force) toast('Riconoscimento non disponibile: serve internet la prima volta');
  } finally {
    naming = false; updateHeader();
    if (pendingName) { pendingName = false; autoNameMaybe(); }
  }
}
function updateHeader() {
  const n = pages.length;
  $('#pageCount').textContent = (n === 1 ? '1 pagina' : `${n} pagine`) + (naming ? ' · riconosco il documento…' : '');
  const b = $('#autoNameBtn');
  b.classList.toggle('auto', autoName);
  b.classList.toggle('working', naming);
}

/* ---------------- storage (IndexedDB, solo locale) ---------------- */
const store = {
  db: null,
  async open() {
    if (!('indexedDB' in window)) return;
    this.db = await new Promise((res, rej) => {
      const r = indexedDB.open('glass-scan', 1);
      r.onupgradeneeded = () => {
        const db = r.result;
        if (!db.objectStoreNames.contains('pages')) db.createObjectStore('pages', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta');
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  },
  req(name, mode, fn) {
    if (!this.db) return Promise.resolve(null);
    return new Promise((res, rej) => {
      const t = this.db.transaction(name, mode);
      const q = fn(t.objectStore(name));
      t.oncomplete = () => res(q ? q.result : null);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    });
  },
  all() { return this.req('pages', 'readonly', s => s.getAll()); },
  put(p) { return this.req('pages', 'readwrite', s => s.put(p)); },
  del(id) { return this.req('pages', 'readwrite', s => s.delete(id)); },
  clear() { return this.req('pages', 'readwrite', s => s.clear()); },
  get(k) { return this.req('meta', 'readonly', s => s.get(k)); },
  set(k, v) { return this.req('meta', 'readwrite', s => s.put(v, k)); }
};
const safe = p => Promise.resolve(p).catch(e => { console.warn(e); return null; });

/* ---------------- helpers ---------------- */
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function ctx2d(c) { return c.getContext('2d', { willReadFrequently: true }); }
function loadImg(src) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Immagine non leggibile')); i.src = src; });
}
function imgToCanvas(img, max) {
  const w0 = img.naturalWidth || img.width, h0 = img.naturalHeight || img.height;
  const s = Math.min(1, max / Math.max(w0, h0), Math.sqrt(MAX_AREA / (w0 * h0)));
  const c = mk(Math.round(w0 * s), Math.round(h0 * s));
  const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(img, 0, 0, c.width, c.height);
  return c;
}
const MAX_AREA = 12.6e6; // ~12 MP: risoluzione piena delle fotocamere da 12 MP, entro i limiti dei canvas su iPhone
async function blobToCanvas(blob, max = 6000) {
  const url = URL.createObjectURL(blob);
  try { return imgToCanvas(await loadImg(url), max); } finally { URL.revokeObjectURL(url); }
}
function scaleCanvas(src, max) {
  const s = Math.min(1, max / Math.max(src.width, src.height));
  if (s === 1) return src;
  const c = mk(Math.max(1, Math.round(src.width * s)), Math.max(1, Math.round(src.height * s)));
  const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(src, 0, 0, c.width, c.height);

  const [nx, ny] = ED.corners[i], sx = nx * ED.prev.width, sy = ny * ED.prev.height;
  const size = 120 / (3 * ED.disp.s);
  x.fillStyle = '#05070e'; x.fillRect(0, 0, 240, 240);
  x.imageSmoothingQuality = 'high';
  x.drawImage(ED.prev, sx - size / 2, sy - size / 2, size, size, 0, 0, 240, 240);
  // lati adiacenti
  const k = 240 / size, toL = ([px, py]) => [(px * ED.prev.width - sx) * k + 120, (py * ED.prev.height - sy) * k + 120];
  x.strokeStyle = '#7ef0da'; x.lineWidth = 3;
  [ED.corners[(i + 3) % 4], ED.corners[(i + 1) % 4]].forEach(o => { const [ax, ay] = toL(o); x.beginPath(); x.moveTo(120, 120); x.lineTo(ax, ay); x.stroke(); });
  x.strokeStyle = 'rgba(255,255,255,.95)'; x.lineWidth = 2;
  x.beginPath(); x.moveTo(120, 96); x.lineTo(120, 144); x.moveTo(96, 120); x.lineTo(144, 120); x.stroke();
  L.classList.toggle('right', nx < 0.5);
  L.classList.remove('hidden');
}
let drag = null;
const stage = $('#stage');
stage.addEventListener('pointerdown', e => {
  if (ED.tab !== 'crop' || !ED.prev) return;
  const r = $('#cropBox').getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  let bi = -1, bd = 46;
  ED.corners.forEach(([cx, cy], i) => { const dd = Math.hypot(cx * ED.disp.w - x, cy * ED.disp.h - y); if (dd < bd) { bd = dd; bi = i; } });
  if (bi < 0) return;
  e.preventDefault();
  drag = { i: bi, ox: ED.corners[bi][0] * ED.disp.w - x, oy: ED.corners[bi][1] * ED.disp.h - y, r };
  stage.setPointerCapture(e.pointerId);
  drawOverlay(bi); updateLoupe(bi);
});
stage.addEventListener('pointermove', e => {
  if (!drag) return;
  const x = e.clientX - drag.r.left + drag.ox, y = e.clientY - drag.r.top + drag.oy;
  ED.corners[drag.i] = [clamp(x / ED.disp.w, 0, 1), clamp(y / ED.disp.h, 0, 1)];
  drawOverlay(drag.i); updateLoupe(drag.i);
});
const endDrag = () => { if (!drag) return; drag = null; drawOverlay(); $('#loupe').classList.add('hidden'); };
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);
window.addEventListener('resize', () => { if (!$('#editor').classList.contains('hidden') && ED.tab === 'crop') layoutCrop(); });

$('#autoBtn').onclick = () => {
  const q = detectCorners(ED.prev);
  if (q) { ED.corners = q; drawOverlay(); toast('Bordi rilevati'); }
  else toast('Bordi non trovati: sistemali a mano');
};
$('#fullBtn').onclick = () => { ED.corners = FULL.map(c => c.slice()); drawOverlay(); };

let previewToken = 0;
async function renderPreview() {
  const t = ++previewToken; await raf(); if (t !== previewToken || !ED.prev) return;
  const c = renderFrom(ED.prev, ED.corners, ED.rot, ED.filter, 1400);
  if (t !== previewToken) return;
  const pc = $('#previewCanvas'); pc.width = c.width; pc.height = c.height; pc.getContext('2d').drawImage(c, 0, 0);
}
function buildChips() {
  const wrap = $('#chips'); wrap.innerHTML = '';
  const base = rotate(warp(ED.prev, ED.corners.map(([x, y]) => [x * ED.prev.width, y * ED.prev.height]), 200), ED.rot);
  FILTERS.forEach(([id, label]) => {
    const c = mk(base.width, base.height); c.getContext('2d').drawImage(base, 0, 0); applyFilter(c, id);
    const b = document.createElement('button');
    b.className = 'chip' + (id === ED.filter ? ' on' : '');
    b.innerHTML = `<div class="th"></div><span>${label}</span>`;
    b.querySelector('.th').appendChild(c);
    b.onclick = () => { ED.filter = id; wrap.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b)); renderPreview(); };
    wrap.appendChild(b);
  });
}
$('#rotL').onclick = () => { ED.rot = (ED.rot + 3) % 4; buildChips(); renderPreview(); };
$('#rotR').onclick = () => { ED.rot = (ED.rot + 1) % 4; buildChips(); renderPreview(); };
$('#edCancel').onclick = closeEditor;
$('#edSave').onclick = async () => {
  busy('Elaborazione…'); await raf();
  try {
    const wasNew = !ED.page;
    await savePage(ED.src, ED.corners, ED.rot, ED.filter, ED.page);
    lastFilter = ED.filter; safe(store.set('filter', lastFilter));
    const savedId = ED.page ? ED.page.id : null;
    closeEditor(); renderGrid();
    toast(wasNew ? 'Pagina aggiunta' : 'Pagina aggiornata');
    if (!wasNew && savedId === autoFrom) autoFrom = null; // prima pagina ritoccata: rileggila
    autoNameMaybe();
  } catch (e) { toast('Errore: ' + e.message); }
  finally { busy(false); }
};

/* ---------------- export ---------------- */
$('#exportBtn').onclick = () => {
  if (!pages.length) { toast('Nessuna pagina da esportare'); return; }
  $('#sheet').classList.remove('hidden');
};
$('#sheet').onclick = e => { if (e.target.id === 'sheet') $('#sheet').classList.add('hidden'); };
document.querySelectorAll('#sizeSeg button').forEach(b => b.onclick = () => {
  exportSize = b.dataset.size;
  document.querySelectorAll('#sizeSeg button').forEach(x => x.classList.toggle('on', x === b));
});
async function buildPDF() {
  if (!window.jspdf) throw new Error('Libreria PDF non caricata (serve internet la prima volta)');
  const { jsPDF } = window.jspdf; let doc = null;
  for (const p of sorted()) {
    const data = await blobToDataURL(p.processed), land = p.w > p.h, o = land ? 'l' : 'p';
    if (exportSize === 'a4') {
      if (!doc) doc = new jsPDF({ orientation: o, unit: 'mm', format: 'a4', compress: true }); else doc.addPage('a4', o);
      const PW = land ? 297 : 210, PH = land ? 210 : 297, s = Math.min(PW / p.w, PH / p.h), w = p.w * s, h = p.h * s;
      doc.addImage(data, 'JPEG', (PW - w) / 2, (PH - h) / 2, w, h, undefined, 'NONE');
    } else {
      const w = p.w * 72 / 300, h = p.h * 72 / 300;
      if (!doc) doc = new jsPDF({ orientation: o, unit: 'pt', format: [w, h], compress: true }); else doc.addPage([w, h], o);
      doc.addImage(data, 'JPEG', 0, 0, w, h, undefined, 'NONE');
    }
  }
  return doc.output('blob');
}
function download(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
}
async function shareFiles(files) {
  if (!(navigator.canShare && navigator.canShare({ files }))) return false;
  try { await navigator.share({ files, title: docName }); return true; }
  catch (e) { return e.name === 'AbortError'; }
}
$('#pdfDl').onclick = async () => {
  busy('Creo il PDF…');
  try { download(await buildPDF(), fileBase() + '.pdf'); $('#sheet').classList.add('hidden'); toast('PDF scaricato'); }
  catch (e) { toast(e.message); } finally { busy(false); }
};
$('#pdfShare').onclick = async () => {
  busy('Creo il PDF…');
  try {
    const blob = await buildPDF(); busy(false);
    const file = new File([blob], fileBase() + '.pdf', { type: 'application/pdf' });
    if (!(await shareFiles([file]))) { download(blob, file.name); toast('Condivisione non disponibile: PDF scaricato'); }
    $('#sheet').classList.add('hidden');
  } catch (e) { toast(e.message); } finally { busy(false); }
};
$('#jpgShare').onclick = async () => {
  const list = sorted(), base = fileBase();
  const files = list.map((p, i) => new File([p.processed], `${base} ${i + 1}.jpg`, { type: 'image/jpeg' }));
  if (!(await shareFiles(files))) { files.forEach((f, i) => setTimeout(() => download(f, f.name), i * 350)); toast('Immagini scaricate'); }
  $('#sheet').classList.add('hidden');
};

/* ---------------- avvio ---------------- */
(async () => {
  try { await store.open(); } catch (e) { console.warn(e); toast('Salvataggio locale non disponibile'); }
  if (navigator.storage && navigator.storage.persist) safe(navigator.storage.persist());
  pages = (await safe(store.all())) || [];
  docName = (await safe(store.get('name'))) || defaultName();
  lastFilter = (await safe(store.get('filter'))) || 'magic';
  const an = await safe(store.get('autoName')); autoName = an === null || an === undefined ? true : !!an;
  autoFrom = (await safe(store.get('autoFrom'))) || null;
  $('#docName').value = docName;
  renderGrid();
})();
</script>
</body>
</html>
